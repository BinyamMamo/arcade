<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#06140a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Snake Xenzia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Rotate-to-landscape gate (mobile portrait) -->
  <div id="rotate" class="overlay-screen" hidden>
    <div class="rotate-art">
      <div class="rotate-phone"></div>
      <div class="rotate-arrow"></div>
    </div>
  </div>

  <!-- The whole game renders here -->
  <div id="stage">
    <canvas id="game"></canvas>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
